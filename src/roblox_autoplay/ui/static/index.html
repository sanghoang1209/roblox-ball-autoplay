<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Roblox Ball Autoplay — Control Panel</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-canvas: #0b101b;
      --bg-card: rgba(11, 17, 30, 0.60);
      --bg-card-hover: rgba(20, 30, 52, 0.74);
      --bg-input: rgba(8, 13, 24, 0.56);
      --border: rgba(255, 255, 255, 0.16);
      --border-active: #4ade80;
      --text-primary: #f8fafc;
      --text-muted: #cbd5e1;
      --brand: #22c55e;
      --brand-bright: #4ade80;
      --brand-dark: #15803d;
      --danger: #ef4444;
      --danger-dark: #b91c1c;
      --amber: #f59e0b;
      --sky: #38bdf8;
      --scrollbar-thumb: #475569;
      --scrollbar-track: rgba(14, 21, 36, 0.45);
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      accent-color: var(--brand);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(180deg, rgba(8, 12, 22, 0.22) 0%, rgba(8, 12, 22, 0.40) 100%),
        url("/assets/ui_background.jpg") center center / cover no-repeat fixed;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.5;
      min-block-size: 100dvh;
      padding: 18px 22px;
    }

    .shell {
      inline-size: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top bar split to far left & far right so center avatar stays clear */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-pill,
    .stats-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .roblox-logo {
      inline-size: 38px;
      block-size: 38px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(74, 222, 128, 0.45);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-pill h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-pill p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--border);
    }

    .status-dot {
      inline-size: 8px;
      block-size: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-pill.running .status-dot {
      background: var(--brand-bright);
      box-shadow: 0 0 10px var(--brand-bright);
    }

    .status-pill.cooldown .status-dot {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    .stat-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #e2e8f0;
    }

    /* 3-column layout: Left panels | Open center for avatar | Right panels */
    .layout-grid {
      display: grid;
      grid-template-columns: minmax(290px, 360px) 1fr minmax(290px, 360px);
      grid-template-areas: "left spacer right";
      gap: 20px;
      align-items: start;
      inline-size: 100%;
    }

    .col-left {
      grid-area: left;
      min-inline-size: 0;
    }

    .col-right {
      grid-area: right;
      min-inline-size: 0;
    }

    @media (max-width: 960px) {
      .layout-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "left"
          "right";
      }
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-block-end: 12px;
    }

    .card-title {
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Mode Selector */
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .mode-card {
      text-align: left;
      inline-size: 100%;
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .mode-card:hover {
      background: var(--bg-card-hover);
    }

    .mode-card.active {
      border-color: var(--border-active);
      background: rgba(34, 197, 94, 0.14);
    }

    .mode-card:focus-visible {
      outline: 3px solid var(--brand-bright);
      outline-offset: 2px;
    }

    .mode-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-block-end: 4px;
    }

    .mode-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-vision {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
      border: 1px solid rgba(74, 222, 128, 0.35);
    }

    .badge-timer {
      background: rgba(56, 189, 248, 0.18);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .mode-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Controls */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 11px;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-primary);
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      transition: transform 0.08s ease, background-color 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: rgba(41, 53, 72, 0.95);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn:focus-visible {
      outline: 3px solid var(--brand-bright);
      outline-offset: 2px;
    }

    .btn-primary {
      flex: 1 1 auto;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      border-color: rgba(74, 222, 128, 0.45);
      color: #052e16;
      font-weight: 700;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--brand-bright), var(--brand));
    }

    .btn-danger {
      flex: 1 1 auto;
      background: linear-gradient(135deg, var(--danger), var(--danger-dark));
      border-color: rgba(248, 113, 113, 0.45);
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) {
      background: linear-gradient(135deg, #f87171, var(--danger));
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.76rem;
      border-radius: 8px;
    }

    /* Settings Form */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-inline-size: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input[type="number"],
    textarea {
      inline-size: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-family: inherit;
    }

    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      resize: vertical;
      min-block-size: 62px;
    }

    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--brand-bright);
      outline-offset: 1px;
      border-color: var(--brand-bright);
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
    }

    .switch-row.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .switch-row span {
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    input[type="checkbox"][switch] {
      accent-color: var(--brand);
      margin: 0;
      cursor: pointer;
    }

    input[type="checkbox"][switch]:disabled {
      cursor: not-allowed;
    }

    input[type="checkbox"][switch]:focus-visible {
      outline: 3px solid var(--brand-bright);
      outline-offset: 4px;
    }

    .no-native-switch input[type="checkbox"][switch] {
      appearance: none;
      inline-size: 40px;
      block-size: 22px;
      border-radius: 999px;
      background: #334155;
      position: relative;
      transition: background-color 0.15s ease;
    }

    .no-native-switch input[type="checkbox"][switch]::after {
      content: "";
      position: absolute;
      inset-block-start: 3px;
      inset-inline-start: 3px;
      inline-size: 16px;
      block-size: 16px;
      border-radius: 50%;
      background: #f8fafc;
      transition: transform 0.15s ease;
    }

    .no-native-switch input[type="checkbox"][switch]:checked {
      background: var(--brand);
    }

    .no-native-switch input[type="checkbox"][switch]:checked::after {
      transform: translateX(18px);
    }

    /* Log Console */
    .log-box {
      background: rgba(7, 11, 19, 0.68);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px;
      block-size: 260px;
      overflow-y: auto;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    @supports not (scrollbar-color: auto) {
      .log-box {
        scrollbar-width: auto;
      }
      .log-box::-webkit-scrollbar {
        inline-size: 8px;
      }
      .log-box::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      .log-box::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
    }

    .toast {
      font-size: 0.8rem;
      min-block-size: 18px;
      color: var(--brand-bright);
    }

    .toast.error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Top bar split to corners so avatar face & hat stay visible -->
    <header class="topbar">
      <div class="brand-pill">
        <div class="roblox-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
            <rect x="6" y="6" width="20" height="20" rx="3" transform="rotate(14 16 16)" fill="#4ade80"/>
            <rect x="13" y="13" width="6" height="6" rx="1" transform="rotate(14 16 16)" fill="#0b101b"/>
          </svg>
        </div>
        <div>
          <h1>Roblox Ball Autoplay</h1>
          <p>Chạy ngầm 100% · macOS &amp; Windows</p>
        </div>
      </div>

      <div class="stats-pill">
        <div id="statusPill" class="status-pill">
          <span class="status-dot"></span>
          <span id="statusText">Đang dừng</span>
        </div>
        <div class="stat-meta">
          <span id="robloxBadge">Roblox: Đang kiểm tra...</span>
          <span>·</span>
          <span>Đã bấm: <strong id="playCount">0</strong></span>
        </div>
      </div>
    </header>

    <main class="layout-grid">
      <!-- Far Left: 1. Chế độ chơi & 3. Tinh chỉnh chế độ -->
      <div class="stack col-left">
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">1. Chọn chế độ treo</h2>
          </div>
          <div id="modeList" class="mode-list"></div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">3. Tinh chỉnh chế độ</h2>
            <span id="editingProfileId" class="badge badge-vision">default_play</span>
          </div>

          <form id="settingsForm" class="form-grid">
            <div class="field">
              <label for="cooldownSec">Cooldown (s)</label>
              <input id="cooldownSec" type="number" min="0" step="5" value="180">
            </div>

            <div class="field">
              <label for="scanIntervalSec">Quét mỗi (s)</label>
              <input id="scanIntervalSec" type="number" min="0.5" step="0.5" value="3">
            </div>

            <div class="field">
              <label for="stepDelaySec">Trễ phím (s)</label>
              <input id="stepDelaySec" type="number" min="0.05" step="0.02" value="0.22">
            </div>

            <div class="field full">
              <label id="ballSelectionRow" class="switch-row" for="ballSelectionEnabled">
                <span>Tự động Ban &amp; Pick bóng</span>
                <input id="ballSelectionEnabled" type="checkbox" switch>
              </label>
            </div>

            <div class="field full">
              <label for="sequenceInput">Chuỗi phím UI Navigation</label>
              <textarea id="sequenceInput" spellcheck="false"></textarea>
            </div>

            <div class="field full">
              <div class="btn-row">
                <button id="saveProfileBtn" class="btn" type="submit" style="flex: 1 1 auto;">💾 Lưu vào file Profile</button>
              </div>
              <div id="toast" class="toast" role="status" aria-live="polite"></div>
            </div>
          </form>
        </section>
      </div>

      <!-- Far Right: 2. Điều khiển & Nhật ký hoạt động -->
      <div class="stack col-right">
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">2. Điều khiển</h2>
          </div>
          <div class="btn-row">
            <button id="toggleRunBtn" class="btn btn-primary" type="button">▶️ Bắt đầu</button>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Nhật ký hoạt động</h2>
            <button id="clearLogBtn" class="btn btn-sm" type="button">Xóa log</button>
          </div>
          <div id="logBox" class="log-box">Sẵn sàng. Hãy chọn chế độ và bấm "Bắt đầu".</div>
        </section>
      </div>
    </main>
  </div>

  <script>
    if (!("switch" in HTMLInputElement.prototype)) {
      document.documentElement.classList.add("no-native-switch");
    }

    const STATE_LABELS = {
      STOPPED: "Đang dừng",
      STARTING: "Đang khởi động...",
      WAITING_ROBLOX: "Chờ mở Roblox...",
      WAITING_WINDOW: "Chờ cửa sổ Roblox...",
      SCANNING: "Đang quét nút Play",
      PLAYING_SEQUENCE: "Đang gửi phím...",
      COOLDOWN: "Đang nghỉ Cooldown",
    };

    const PROFILE_ORDER = ["default_play", "ranked", "timer_fullscreen"];

    let profiles = [];
    let selectedProfileId = null;
    let isRunning = false;

    const el = (id) => document.getElementById(id);

    function showToast(msg, isError = false) {
      const t = el("toast");
      t.textContent = msg;
      t.classList.toggle("error", isError);
    }

    function isRankedProfile(profileId) {
      return profileId === "ranked";
    }

    function readFormOverrides() {
      const ranked = isRankedProfile(selectedProfileId);
      return {
        cooldown_sec: Number(el("cooldownSec").value),
        scan_interval_sec: Number(el("scanIntervalSec").value),
        step_delay_sec: Number(el("stepDelaySec").value),
        anti_afk_enabled: false,
        ball_selection_enabled: ranked ? el("ballSelectionEnabled").checked : false,
        sequence: el("sequenceInput").value,
      };
    }

    function fillForm(profile) {
      const ranked = isRankedProfile(profile.id);
      el("editingProfileId").textContent = profile.id;
      el("cooldownSec").value = profile.timing.cooldown_sec;
      el("scanIntervalSec").value = profile.timing.scan_interval_sec;
      el("stepDelaySec").value = profile.timing.step_delay_sec;

      const ballInput = el("ballSelectionEnabled");
      const ballRow = el("ballSelectionRow");
      ballInput.disabled = !ranked;
      ballInput.checked = ranked && Boolean(profile.ball_selection && profile.ball_selection.enabled);
      ballRow.classList.toggle("locked", !ranked);

      el("sequenceInput").value = profile.sequence.join(", ");
    }

    function renderModes() {
      const container = el("modeList");
      container.innerHTML = "";
      for (const p of profiles) {
        const isTimer = p.detector.type === "timer";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mode-card" + (p.id === selectedProfileId ? " active" : "");
        btn.innerHTML = `
          <div class="mode-top">
            <span class="mode-name"></span>
            <span class="badge ${isTimer ? "badge-timer" : "badge-vision"}">
              ${isTimer ? "⏱️ Timer" : "👁️ OCR / Vision"}
            </span>
          </div>
          <div class="mode-desc"></div>
        `;
        btn.querySelector(".mode-name").textContent = p.name;
        btn.querySelector(".mode-desc").textContent = p.description || p.id;
        btn.addEventListener("click", () => {
          selectedProfileId = p.id;
          fillForm(p);
          renderModes();
          showToast("");
        });
        container.appendChild(btn);
      }
    }

    async function loadProfiles() {
      const res = await fetch("/api/profiles");
      const data = await res.json();
      const raw = data.profiles || [];
      raw.sort((a, b) => {
        const ia = PROFILE_ORDER.indexOf(a.id);
        const ib = PROFILE_ORDER.indexOf(b.id);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
      profiles = raw;
      if (!selectedProfileId && profiles.length > 0) {
        selectedProfileId = profiles[0].id;
      }
      const current = profiles.find((p) => p.id === selectedProfileId) || profiles[0];
      if (current) {
        selectedProfileId = current.id;
        fillForm(current);
      }
      renderModes();
    }

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        const st = await res.json();
        isRunning = Boolean(st.running);

        const pill = el("statusPill");
        pill.className = "status-pill";
        if (st.state === "COOLDOWN") pill.classList.add("cooldown");
        else if (isRunning) pill.classList.add("running");

        el("statusText").textContent = STATE_LABELS[st.state] || st.state;
        el("playCount").textContent = st.play_count ?? 0;
        el("robloxBadge").textContent = st.roblox_running
          ? "Roblox: Đang mở"
          : "Roblox: Chưa mở";

        const toggleBtn = el("toggleRunBtn");
        if (isRunning) {
          toggleBtn.textContent = "⏹️ Dừng";
          toggleBtn.className = "btn btn-danger";
        } else {
          toggleBtn.textContent = "▶️ Bắt đầu";
          toggleBtn.className = "btn btn-primary";
        }

        if (Array.isArray(st.logs) && st.logs.length > 0) {
          const box = el("logBox");
          const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
          box.textContent = st.logs.join("\n");
          if (atBottom) box.scrollTop = box.scrollHeight;
        }
      } catch (_) {
        el("statusText").textContent = "Mất kết nối server";
      }
    }

    el("toggleRunBtn").addEventListener("click", async () => {
      showToast("");
      if (isRunning) {
        await fetch("/api/stop", { method: "POST" });
      } else {
        const res = await fetch("/api/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            profile_id: selectedProfileId,
            overrides: readFormOverrides(),
          }),
        });
        const data = await res.json();
        if (!data.ok) showToast(data.error || "Không thể khởi động.", true);
      }
      await pollStatus();
    });

    el("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/save-profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          profile_id: selectedProfileId,
          updates: readFormOverrides(),
        }),
      });
      const data = await res.json();
      if (!data.ok) {
        showToast(data.error || "Không thể lưu profile.", true);
        return;
      }
      showToast("✅ Đã lưu cài đặt vào file profile!");
      await loadProfiles();
    });

    el("clearLogBtn").addEventListener("click", async () => {
      await fetch("/api/clear-logs", { method: "POST" });
      el("logBox").textContent = "Đã xóa log.";
    });

    loadProfiles().then(pollStatus);
    setInterval(pollStatus, 1000);
  </script>
</body>
</html>
